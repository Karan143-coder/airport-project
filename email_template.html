<html>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px;">
    <div style="max-width: 500px; margin: 0 auto; background-color: #1e1f22; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); color: #ffffff;">
        
        <!-- Header Blue Box -->
        <div style="background-color: #5885e7; padding: 30px; text-align: center;">
            <h1 style="margin: 0; color: #111111; font-size: 28px; font-weight: bold;">Airport Notification</h1>
        </div>
        
        <!-- Main Content Body -->
        <div style="padding: 30px; line-height: 1.6;">
            <h2 style="margin-top: 0; color: #ffffff; font-size: 22px;">Hello {passenger_name},</h2>
            <p style="color: #cccccc; font-size: 16px;">Your flight has been updated.</p>
            
            <p style="font-size: 18px; margin: 20px 0;">
                <strong style="color: #ffffff;">Flight ID:</strong> <span style="color: #cccccc;">{flight_id}</span>
            </p>
            
            <h3 style="color: #5885e7; font-size: 20px; margin: 20px 0;">
                New Status : <span style="text-transform: lowercase;">{new_status}</span>
            </h3>
            
            <p style="color: #cccccc; font-size: 16px; margin-top: 30px;">Thank you for choosing our airline.</p>
        </div>
        
        <!-- Footer Dark Box -->
        <div style="background-color: #2b2d31; padding: 15px; text-align: center; color: #888888; font-size: 14px;">
            Airport Team
        </div>
        
    </div>
</body>
</html>
