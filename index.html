<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Management System - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- 1. FULL-SCREEN LOGIN SECTION -->
    <div id="login-container" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-96 border border-gray-200">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Airport Login</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" placeholder="Enter username" class="w-full border px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="password" placeholder="Enter password" class="w-full border px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-16">
                        <button type="button" onclick="togglePassword()" class="absolute right-2 top-2 text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded">Show</button>
                    </div>
                </div>

                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">Login</button>
            </div>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD / TESTING PORTAL (Initially Hidden) -->
    <div id="dashboard-container" class="hidden p-6 max-w-6xl mx-auto">
        <header class="mb-6 border-b border-gray-300 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Airport Management System</h1>
                <p class="text-sm text-gray-500">Live API Manual Testing Portal</p>
            </div>
            <div class="flex items-center gap-4">
                <span class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">Server Active</span>
                <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold px-3 py-1 rounded-lg">Logout</button>
            </div>
        </header>

        <!-- Tabs & Endpoints Section -->
        <div class="flex border-b border-gray-300 mb-6 space-x-2">
            <button onclick="switchTab('passengers')" id="tab-passengers" class="py-2 px-4 font-semibold text-sm border-b-2 border-blue-600 text-blue-600">Passengers (6)</button>
            <button onclick="switchTab('staff')" id="tab-staff" class="py-2 px-4 font-semibold text-sm border-b-2 border-transparent text-gray-500">Staff (6)</button>
            <button onclick="switchTab('flights')" id="tab-flights" class="py-2 px-4 font-semibold text-sm border-b-2 border-transparent text-gray-500">Flights (6)</button>
            <button onclick="switchTab('baggage')" id="tab-baggage" class="py-2 px-4 font-semibold text-sm border-b-2 border-transparent text-gray-500">Baggage (6)</button>
        </div>

        <!-- Dashboard Content Box -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
            <div id="sec-passengers" class="tab-content">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Passenger Endpoints</h2>
                
            </div>
        </div>
    </div>

    <script>
        // Password Show/Hide Toggle Function
        function togglePassword() {
            const passInput = document.getElementById('password');
            const btn = event.target;
            if (passInput.type === 'password') {
                passInput.type = 'text';
                btn.textContent = 'Hide';
            } else {
                passInput.type = 'password';
                btn.textContent = 'Show';
            }
        }

        // Login Handler Function
        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const result = await response.json();
                if(response.ok) {
                    // Hide Login screen and show Dashboard screen
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('dashboard-container').classList.remove('hidden');
                } else {
                    alert(result.detail || "Wrong Credentials!");
                }
            } catch (err) {
                alert("Server connection error!");
            }
        }

        // Logout Handler Function
        function handleLogout() {
            document.getElementById('dashboard-container').classList.add('hidden');
            document.getElementById('login-container').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function switchTab(tabName) {
            
        }
    </script>
</body>
</html>
